name: Unit tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit tests and coverage thresholds
        run: npm run test:coverage
      - name: Production build
        run: npm run build
        env:
          VITE_API_BASE: https://statsapi.mlb.com/api/v1
          VITE_PUBLIC_PATH: /${{ github.event.repository.name }}/
      - name: Cobertura markdown summary (for job summary)
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage/cobertura-coverage.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: file
          thresholds: '50 75'
      - name: Add coverage to GitHub Actions job summary
        run: |
          echo "## Code coverage (Cobertura)" >> "$GITHUB_STEP_SUMMARY"
          cat code-coverage-results.md >> "$GITHUB_STEP_SUMMARY"
      # Cobertura XML from Vitest (`coverage/cobertura-coverage.xml`). Same-repo PRs only:
      # forked PR workflows get a read-only token and cannot post comments on the base repo PR.
      - name: Cobertura coverage comment on PR
        if: >
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        uses: 5monkeys/cobertura-action@ee5787cc56634acddedc51f21c7947985531e6eb # v14
        with:
          path: coverage/cobertura-coverage.xml
          minimum_coverage: 0
          fail_below_threshold: false
          show_line: true
          show_branch: true
          # cobertura-action defaults skip_covered to true, which hides 100%-covered files from the table.
          skip_covered: false
          report_name: Unit tests (Vitest)
