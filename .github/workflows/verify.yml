# Parallel PR/push verification jobs (format/lint/audit/typecheck/test/build), via
# dani-actions' shared npm-verify.yml. Deploy lives in its own file (deploy-pages.yml)
# since it has a different trigger (push to main only) and different risk profile.

name: verify

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    permissions:
      contents: read
      pull-requests: write
      checks: write
    uses: danibsheehan/dani-actions/.github/workflows/npm-verify.yml@v12
    with:
      packages: |
        [{"name": "app", "path": ".",
          "test-command": "npm run test:coverage",
          "build-command": "VITE_API_BASE=https://statsapi.mlb.com/api/v1 VITE_PUBLIC_PATH=/${{ github.event.repository.name }}/ npm run build",
          "coverage-file": "coverage/cobertura-coverage.xml",
          "typecheck-command": "npm run typecheck",
          "paths": "app:\n  - 'src/**'\n  - 'public/**'\n  - 'index.html'\n  - 'package.json'\n  - 'package-lock.json'\n  - 'tsconfig.json'\n  - 'vite.config.mjs'\n  - 'eslint.config.mjs'\n  - 'prettier.config.mjs'\n  - '.nvmrc'\n  - '.github/workflows/**'\n  - '.github/dependabot.yml'\n  - '.github/labeler.yml'"}]
      skip-covered: false
